<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geokit Standalone kit</title>
  <link rel="stylesheet" href="../shared/maps-shell.css">
  <link rel="stylesheet" href="../shared/brutalist.css">
</head>
<body data-demo-active="standalone-kit">
  <aside id="demo-nav" aria-label="Demo pages"></aside>
  <div id="map-container">
    <gk-map
      id="standalone-map"
      provider="maptiler"
      lat="39.8283"
      lng="-98.5795"
      zoom="4"
      theme="dark"
      map-style="dataviz-dark">
      <gk-layer
        layer-dataset="territory"
        fill-opacity="0.4"
        fill-color="#6366f1"
        interactive="true">
      </gk-layer>
      <gk-point-layer
        source-id="demo-points"
        point-layer-id="demo-points-layer"
        glow-layer-id="demo-points-glow"
        interactive="true">
      </gk-point-layer>
    </gk-map>
  </div>
  <script type="module" src="./standalone-kit.js"></script>
</body>
</html>
