<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geokit Map Demo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="map-container">
    <!-- Theme toggle button -->
    <button id="theme-toggle" class="theme-toggle" title="Toggle theme">
      <span class="theme-icon">🌙</span>
    </button>
    <gk-map 
      id="demo-map"
      provider="maptiler"
      lat="40.7128" 
      lng="-74.006" 
      zoom="12"
      theme="dark"
      sync-url>
      <!-- Demo isochrone: 15-minute driving time from NYC center (H3 hexagon version) -->
      <!-- Color works on both light and dark themes so it stays visible after theme toggle -->
      <gk-isochrone 
        lat="40.7128" 
        lng="-74.006" 
        time="15" 
        mode="driving"
        render="h3"
        h3-resolution="10"
        color="#3388ff"
        opacity="0.25"
        stroke-width="0">
      </gk-isochrone>
      
      <!-- Demo point: Interactive point with popup on click -->
      <!-- Point renders above the isochrone -->
      <gk-point 
        lat="40.7128" 
        lng="-74.006"
        point-id="nyc-center"
        point-name="New York City Center"
        color="#00D9FF"
        size="3">
      </gk-point>
      
      <!-- Demo popup: Styled popup showing information -->
      <gk-popup 
        lat="40.7580" 
        lng="-73.9855"
        content="<h4>Times Square</h4><p>Famous intersection in Manhattan</p>"
        anchor="bottom"
        close-button="true">
      </gk-popup>
    </gk-map>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
