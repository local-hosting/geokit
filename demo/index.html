<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geokit Map Demo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="map-container">
    <gk-map 
      provider="maptiler"
      lat="40.7128" 
      lng="-74.006" 
      zoom="12"
      style="streets">
      <!-- Demo isochrone: 15-minute driving time from NYC center (H3 hexagon version) -->
      <gk-isochrone 
        lat="40.7128" 
        lng="-74.006" 
        time="15" 
        mode="driving"
        render="h3"
        h3-resolution="10"
        color="#FF6B6B"
        opacity="0.5"
        stroke-color="#C92A2A"
        stroke-width="4">
      </gk-isochrone>
    </gk-map>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
