<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN fetch demo</title>
  <link rel="stylesheet" href="./cdn-demo.css">
</head>
<body class="cdn-demo cdn-only">
  <header id="demo-nav"></header>
  <div class="cdn-shell">
    <div class="cdn-panel">
      <h1>fetch</h1>
      <p class="subtitle">@twinfile/geokit/cdn — fetchGlobeCdnJson</p>
      <div class="cdn-field">
        <label for="path">CDN path</label>
        <input id="path" value="/us/indexes/counties.json" />
      </div>
      <div class="cdn-actions">
        <button type="button" id="load">Fetch JSON</button>
        <button type="button" class="secondary" id="head">HEAD via fetchGlobeCdn</button>
      </div>
      <pre class="cdn-log" id="log"></pre>
    </div>
  </div>
  <script type="module" src="./fetch.js"></script>
</body>
</html>
