<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN paths demo</title>
  <link rel="stylesheet" href="./cdn-demo.css">
</head>
<body class="cdn-demo cdn-only">
  <aside id="demo-nav" aria-label="Demo pages"></aside>
  <div class="cdn-shell">
    <div class="cdn-panel">
      <h1>paths</h1>
      <p class="subtitle">URL builders for Globe CDN shapes</p>
      <div class="cdn-field"><label for="fips">County FIPS</label><input id="fips" value="36047" /></div>
      <div class="cdn-field"><label for="state">State</label><input id="state" value="ny" /></div>
      <button type="button" id="build">Build URLs</button>
      <pre class="cdn-log" id="log" style="margin-top:12px"></pre>
    </div>
  </div>
  <script type="module" src="./paths.js"></script>
</body>
</html>
