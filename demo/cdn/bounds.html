<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN bounds demo</title>
  <link rel="stylesheet" href="./cdn-demo.css">
</head>
<body class="cdn-demo">
  <aside id="demo-nav" aria-label="Demo pages"></aside>
