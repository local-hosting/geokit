<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN DMA demo</title>
  <link rel="stylesheet" href="./cdn.css">
</head>
<body class="cdn-demo" data-demo-active="dma">
  <aside id="demo-nav" aria-label="Demo pages"></aside>
  <div class="cdn-shell">
    <div class="cdn-panel">
      <h1>dma</h1>
      <p class="subtitle">
        DMA paths, JWT claim check, regional shards — <code>/markets/dma/**</code> (auth required on production CDN)
      </p>
      <div class="cdn-field">
        <label for="jwt">Bearer JWT (optional)</label>
        <input id="jwt" type="password" placeholder="eyJ… — dma: true or dma: slug" autocomplete="off" />
      </div>
      <div class="cdn-field">
        <label for="region">Region id</label>
        <input id="region" value="texas-la" />
      </div>
      <div class="cdn-field">
        <label for="slug">Market slug</label>
        <input id="slug" value="austin" />
      </div>
      <div class="cdn-actions">
        <button type="button" id="paths">Build paths</button>
        <button type="button" class="secondary" id="fetch-dev-token">Fetch dev token</button>
        <button type="button" class="secondary" id="validate-jwt">Validate JWT</button>
        <button type="button" id="index">Load region index</button>
        <button type="button" class="secondary" id="shard">Load region shard</button>
        <button type="button" id="market">Load market slug</button>
      </div>
      <pre class="cdn-log" id="log"></pre>
    </div>
    <div class="cdn-map-wrap"><div id="map" class="cdn-map"></div></div>
  </div>
  <script type="module" src="./dma.js"></script>
</body>
</html>
