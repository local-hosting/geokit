<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN county demo</title>
  <link rel="stylesheet" href="./cdn.css">
</head>
<body class="cdn-demo" data-demo-active="county">
  <aside id="demo-nav" aria-label="Demo pages"></aside>
  <div class="cdn-shell">
    <div class="cdn-panel">
      <h1>county</h1>
      <p class="subtitle">counties bulk · fetchCountyShapeFeature · fetchCountyShapesForFips</p>
      <div class="cdn-field"><label for="fips">FIPS (comma-separated)</label><input id="fips" value="36047,06037" /></div>
      <div class="cdn-actions">
        <button type="button" id="counties-bulk">Counties bulk</button>
        <button type="button" class="secondary" id="one">Load one</button>
        <button type="button" class="secondary" id="fips-bulk">Load FIPS</button>
      </div>
      <pre class="cdn-log" id="log"></pre>
    </div>
    <div class="cdn-map-wrap"><div id="map" class="cdn-map"></div></div>
  </div>
  <script type="module" src="./county.js"></script>
</body>
</html>
