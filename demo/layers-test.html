<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geokit Layer Creation Test</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./brutalist.css">
  <style>
    /* Layer-test demo: category styles in CSS so theme/design lives here */
    :root {
      --demo-category-default-color: #000000;
      --demo-category-default-glow-opacity: 0;
      --demo-category-default-stroke-width: 1;
      --demo-category-default-radius-scale: 1;
      --demo-category-premium-color: #000000;
      --demo-category-premium-glow-opacity: 0;
      --demo-category-premium-stroke-width: 2;
      --demo-category-premium-radius-scale: 1.1;
      --demo-category-partner-color: #000000;
      --demo-category-partner-glow-opacity: 0;
      --demo-category-partner-stroke-width: 2;
      --demo-category-partner-radius-scale: 1.2;
    }
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: #fff;
      color: #000;
      padding: 10px 15px;
      border: 2px solid #000;
      border-radius: 0;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      max-width: 400px;
    }
    #status .error { color: #000; font-weight: 700; }
    #status .success { color: #000; }
    #status .info { color: #444; }
  </style>
</head>
<body>
  <header id="demo-nav"></header>
  <div id="status">
    <div>Loading map...</div>
  </div>
  <div id="map-container">
    <gk-map 
      id="test-map"
      provider="maptiler"
      lat="39.8283" 
      lng="-98.5795" 
      zoom="4"
      theme="light" map-style="basic">
    </gk-map>
  </div>

  <script type="module" src="./layers-test.js"></script>
</body>
</html>
