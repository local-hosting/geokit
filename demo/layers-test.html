<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geokit Layer Creation Test</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Layer-test demo: category styles in CSS so theme/design lives here */
    :root {
      --demo-category-default-color: #ff6b35;
      --demo-category-default-glow-opacity: 0.55;
      --demo-category-default-stroke-width: 0;
      --demo-category-default-radius-scale: 1;
      --demo-category-premium-color: #02cb56;
      --demo-category-premium-glow-opacity: 0.35;
      --demo-category-premium-stroke-width: 1.5;
      --demo-category-premium-radius-scale: 1.25;
      --demo-category-partner-color: #1a73e8;
      --demo-category-partner-glow-opacity: 0.35;
      --demo-category-partner-stroke-width: 2;
      --demo-category-partner-radius-scale: 1.3;
    }
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      padding: 10px 15px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-width: 400px;
    }
    #status .error { color: #f44; }
    #status .success { color: #4f4; }
    #status .info { color: #4af; }
  </style>
</head>
<body>
  <div id="status">
    <div>Loading map...</div>
  </div>
  <div id="map-container">
    <gk-map 
      id="test-map"
      provider="maptiler"
      lat="39.8283" 
      lng="-98.5795" 
      zoom="4"
      style="streets">
    </gk-map>
  </div>

  <script type="module" src="./layers-test.js"></script>
</body>
</html>
