<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geokit — H3 viewport</title>
  <link rel="stylesheet" href="../shared/maps-shell.css">
  <link rel="stylesheet" href="../shared/sdk-demo.css">
  <style>
    body.h3-viewport-demo {
      overflow: hidden;
    }

    .gk-map-wrap #map-container {
      position: absolute;
      inset: 0;
    }

    .gk-map-wrap gk-map {
      display: block;
      width: 100%;
      height: 100%;
    }

    .h3-viewport-note {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.45;
      opacity: 0.75;
    }
  </style>
</head>
<body class="gk-demo h3-viewport-demo" data-demo-active="h3-viewport">
  <aside id="demo-nav" aria-label="Demo pages"></aside>
  <div class="gk-shell">
    <div class="gk-panel">
      <h1>h3 viewport</h1>
      <p class="subtitle">gk-h3 grid tessellated to the map viewport</p>
      <p class="h3-viewport-note">
        Uses <code>h3CellsForViewportBounds</code> and one shared GeoJSON layer for the
        viewport grid. Pan or zoom to refresh; raise resolution at closer zoom.
      </p>
      <div class="gk-field">
        <label for="resolution">Resolution</label>
        <input id="resolution" type="number" min="0" max="6" value="1" />
      </div>
      <div class="gk-field">
        <label for="max-cells">Max cells</label>
        <input id="max-cells" type="number" min="8" max="400" value="160" />
      </div>
      <div class="gk-actions">
        <button type="button" id="resync">Resync grid</button>
      </div>
      <p class="h3-viewport-note">Grid sync output — DevTools console (<code>[gk-h3]</code>).</p>
    </div>
    <div class="gk-map-wrap">
      <div id="map-container">
        <gk-map
          id="h3-viewport-map"
          provider="maptiler"
          lat="37.19326"
          lng="-99.21257"
          zoom="4.39"
          min-zoom="2"
          max-zoom="12"
          map-style="dataviz-dark"
          max-bearing="0"
          terrain-enabled="false"
          hillshade-enabled="false"
          buildings-enabled="false"
          max-pitch="0"
          pitch="0">
        </gk-map>
      </div>
    </div>
  </div>
  <script type="module" src="./h3-viewport.js"></script>
</body>
</html>
