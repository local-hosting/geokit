<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geokit — DMA</title>
  <link rel="stylesheet" href="../shared/maps-shell.css">
  <link rel="stylesheet" href="../cdn/cdn.css">
  <style>
    body.dma-demo {
      overflow: hidden;
    }

    .cdn-map-wrap #map-container {
      position: absolute;
      inset: 0;
    }

    .cdn-map-wrap gk-map {
      display: block;
      width: 100%;
      height: 100%;
    }

    .scope-toggle {
      display: flex;
      gap: 8px;
    }

    .scope-toggle label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    #slug-field.hidden {
      display: none;
    }
  </style>
</head>
<body class="cdn-demo dma-demo" data-demo-active="dma">
  <aside id="demo-nav" aria-label="Demo pages"></aside>
  <div class="cdn-shell">
    <div class="cdn-panel">
      <h1>dma</h1>
      <p class="subtitle">gk-layer dataset · viewport (all) or slug (one)</p>
      <div class="cdn-field">
        <label for="jwt">Bearer JWT</label>
        <input id="jwt" type="password" placeholder="eyJ… — dma claim required on production CDN" autocomplete="off" />
      </div>
      <div class="cdn-field">
        <span>Scope</span>
        <div class="scope-toggle">
          <label><input type="radio" name="scope" id="scope-all" value="all" checked /> All</label>
          <label><input type="radio" name="scope" id="scope-one" value="one" /> One</label>
        </div>
      </div>
      <div class="cdn-field" id="slug-field">
        <label for="slug">Market slug</label>
        <input id="slug" value="austin" />
      </div>
      <div class="cdn-actions">
        <button type="button" id="fetch-dev-token">Dev token</button>
        <button type="button" class="secondary" id="apply">Apply</button>
      </div>
      <pre class="cdn-log" id="log"></pre>
    </div>
    <div class="cdn-map-wrap">
      <div id="map-container">
        <gk-map
          id="dma-map"
          provider="maptiler"
          lat="37.19326"
          lng="-99.21257"
          zoom="4.39"
          theme="light"
          map-style="basic"
          max-bearing="0">
          <gk-layer dataset="dma" mode="viewport" interactive fill-opacity="0.28"></gk-layer>
        </gk-map>
      </div>
    </div>
  </div>
  <script type="module" src="./dma.js"></script>
</body>
</html>
