<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive map</title>
  <style>
    html, body, #map-container, gk-map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="map-container">
    <gk-map id="open-map" provider="maptiler" theme="dark" map-style="dataviz-dark"></gk-map>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
